<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liga Élite | Galería Oficial</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background:
    radial-gradient(ellipse at 50% 0%, #193b79 0%, transparent 48%),
    linear-gradient(135deg, #050a18, #0a1631 55%, #030713);
  color: white;
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ENCABEZADO */

header {
  position: relative;
  background: linear-gradient(110deg, #07142c, #142f62, #07142c);
  border-bottom: 1px solid rgba(120, 190, 255, 0.65);
  box-shadow: 0 5px 35px rgba(0, 100, 255, 0.18);
  padding: 24px 7%;
}

header::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 10%;
  width: 80%;
  height: 1px;
  background: linear-gradient(90deg, transparent, #b9e8ff, transparent);
}

.header-content {
  max-width: 1250px;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 25px;
}

/* LOGO PNG TRANSPARENTE */

.logo {
  width: 100px;
  height: 100px;
  object-fit: contain;
  flex-shrink: 0;
  background: transparent;
  filter: drop-shadow(0 0 12px rgba(40, 160, 255, 0.35));
}

/* NOMBRE DE LA LIGA */

.brand h1 {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(32px, 5vw, 57px);
  letter-spacing: 1px;
  line-height: 1.1;

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #dceeff 25%,
    #ffffff 45%,
    #9bb4d2 65%,
    #ffffff 85%,
    #829ab8 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  filter: drop-shadow(0 2px 6px rgba(80, 170, 255, 0.4));
}

/* CONTENIDO PRINCIPAL */

main {
  max-width: 1400px;
  margin: auto;
  padding: 65px 6%;
}

/* TÍTULO GALERÍA */

.section-title {
  font-family: 'Anton', sans-serif;
  font-size: clamp(34px, 5vw, 48px);
  letter-spacing: 1px;
  line-height: 1.1;
  margin-bottom: 12px;

  background: linear-gradient(
    180deg,
    #ffffff 0%,
    #dceeff 22%,
    #ffffff 43%,
    #a4bddb 65%,
    #f4faff 82%,
    #829ab8 100%
  );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  filter: drop-shadow(0 3px 10px rgba(70, 160, 255, 0.3));
}

.section-description {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.4px;
  color: #d5e5f7;
  margin-bottom: 40px;
}

/* TARJETAS DE FECHAS */

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 32px;
}

.date-card {
  position: relative;
  min-height: 430px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 38px;

  overflow: hidden;
  border-radius: 22px;
  text-decoration: none;
  color: white;

  background:
    radial-gradient(
      circle at 80% 10%,
      rgba(40, 130, 255, 0.4),
      transparent 40%
    ),
    linear-gradient(145deg, #1760ad, #102d59 55%, #07152d);

  border: 1px solid rgba(175, 220, 255, 0.65);

  box-shadow:
    0 0 12px rgba(45, 140, 255, 0.15),
    0 15px 40px rgba(0, 0, 0, 0.35),
    inset 0 1px 1px rgba(255, 255, 255, 0.25);

  transition: all 0.35s ease;
}

.date-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    125deg,
    transparent 25%,
    rgba(180, 225, 255, 0.12) 50%,
    transparent 70%
  );
  pointer-events: none;
}

.date-card:hover {
  transform: translateY(-8px);
  border-color: #e5f5ff;

  box-shadow:
    0 0 25px rgba(55, 160, 255, 0.45),
    0 20px 45px rgba(0, 0, 0, 0.45);
}

/* CANTIDAD DE FOTOS */

.photo-count {
  position: absolute;
  top: 28px;
  right: 28px;

  border: 1px solid #d9efff;
  border-radius: 30px;
  padding: 11px 22px;

  color: #ffffff;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1px;

  background: rgba(5, 20, 45, 0.5);
  box-shadow: 0 0 15px rgba(100, 190, 255, 0.25);
}

.date-card h3 {
  font-family: 'Anton', sans-serif;
  font-size: 48px;
  letter-spacing: 1px;
  margin-bottom: 8px;

  color: #f1f8ff;
  text-shadow: 0 2px 12px rgba(150, 210, 255, 0.35);
}

.date-card p {
  font-size: 15px;
  color: #d8e9fa;
}

/* ESTADOS DE CARGA Y MENSAJES */

.gallery-message {
  grid-column: 1 / -1;
  color: #d5e5f7;
  font-size: 15px;
  text-align: center;
  padding: 35px 15px;
}

/* PIE DE PÁGINA */

footer {
  text-align: center;
  padding: 32px 15px;
  border-top: 1px solid rgba(130, 190, 255, 0.3);
  color: #9bb8d7;
  font-size: 11px;
  letter-spacing: 3px;
}

/* ADAPTACIÓN A CELULARES */

@media (max-width: 700px) {

  header {
    padding: 20px 5%;
  }

  .header-content {
    gap: 15px;
  }

  .logo {
    width: 75px;
    height: 75px;
  }

  .brand h1 {
    font-size: clamp(25px, 7vw, 38px);
    letter-spacing: 1px;
  }

  main {
    padding: 45px 5%;
  }

  .section-title {
    font-size: 40px;
  }

  .section-description {
    font-size: 14px;
    margin-bottom: 35px;
  }

  .gallery-grid {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .date-card {
    min-height: 340px;
    padding: 27px;
  }

  .date-card h3 {
    font-size: 40px;
  }

  .photo-count {
    top: 22px;
    right: 22px;
  }
}

</style>
</head>

<body>

<header>
  <div class="header-content">

    <img
      class="logo"
      src="Emblema%20de%20f%C3%BAtbol%20Liga%20Elite%20con%20corona.png"
      alt="Logo Liga Élite"
    >

    <div class="brand">
      <h1>LIGA ÉLITE</h1>
    </div>

  </div>
</header>

<main>

  <h2 class="section-title">GALERÍA DE FOTOS</h2>

  <p class="section-description">LAS FOTOS DE CADA JORNADA</p>

  <section class="gallery-grid" id="gallery-grid" aria-live="polite">
    <p class="gallery-message">Cargando álbumes...</p>
  </section>

</main>

<footer>
  LIGA ÉLITE · GALERÍA OFICIAL
</footer>

<script>

  // CONEXIÓN CON GOOGLE SHEETS

  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTttAUPS0FpZuRmyN2S9Taolsx-Rz0f2XwqR0S9oF_kLW0JzeN4x3iUnxC4AtVpFAGbB_0a_oB6uCDS/pub?output=csv";

  const gallery = document.getElementById("gallery-grid");

  // LECTOR CSV

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const next = text[i + 1];

      if (char === '"' && inQuotes && next === '"') {
        cell += '"';
        i++;
      } else if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === "," && !inQuotes) {
        row.push(cell.trim());
        cell = "";
      } else if ((char === "\n" || char === "\r") && !inQuotes) {
        if (char === "\r" && next === "\n") i++;
        row.push(cell.trim());

        if (row.some(value => value !== "")) {
          rows.push(row);
        }

        row = [];
        cell = "";
      } else {
        cell += char;
      }
    }

    row.push(cell.trim());

    if (row.some(value => value !== "")) {
      rows.push(row);
    }

    return rows;
  }

  // NORMALIZAR ENCABEZADOS

  function normalizeHeader(value) {
    return (value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]/g, "");
  }

  function makeDateLabel(value) {
    return (value || "").trim();
  }

  function safeText(value) {
    return String(value ?? "").trim();
  }

  // GENERAR TARJETAS

  function renderAlbums(rows) {

    if (!rows.length) {
      gallery.innerHTML =
        '<p class="gallery-message">Todavía no hay álbumes publicados.</p>';
      return;
    }

    const headers = rows[0].map(normalizeHeader);

    const findColumn = (...names) =>
      headers.findIndex(header => names.includes(header));

    const titleIndex = findColumn(
      "titulo", "album", "nombre", "nombrealbum"
    );

    const dateIndex = findColumn(
      "fecha", "fechadelalbum"
    );

    const countIndex = findColumn(
      "cantidaddefotos", "fotos", "cantidadfotos"
    );

    const linkIndex = findColumn(
      "linkdedrive", "linkdrive", "drive", "enlace", "enlacededrive"
    );

    const requiredMissing =
      titleIndex === -1 ||
      dateIndex === -1 ||
      countIndex === -1 ||
      linkIndex === -1;

    if (requiredMissing) {
      gallery.innerHTML =
        '<p class="gallery-message">Revisá los encabezados de la planilla: TITULO, FECHA, CANTIDAD DE FOTOS y LINK DE DRIVE.</p>';
      return;
    }

    const albums = rows.slice(1).map(row => ({
      title: safeText(row[titleIndex]),
      date: makeDateLabel(row[dateIndex]),
      count: safeText(row[countIndex]),
      link: safeText(row[linkIndex])
    })).filter(album => album.title && album.link);

    if (!albums.length) {
      gallery.innerHTML =
        '<p class="gallery-message">Todavía no hay álbumes cargados. Agregá una fila en la planilla para publicarlo.</p>';
      return;
    }

    gallery.innerHTML = "";

    albums.forEach(album => {

      const card = document.createElement("a");
      card.className = "date-card";
      card.href = album.link;
      card.target = "_blank";
      card.rel = "noopener noreferrer";

      const count = document.createElement("span");
      count.className = "photo-count";
      count.textContent = album.count
        ? `${album.count} FOTOS`
        : "VER FOTOS";

      const title = document.createElement("h3");
      title.textContent = album.title;

      const date = document.createElement("p");
      date.textContent = album.date;

      card.append(count, title, date);
      gallery.appendChild(card);
    });
  }

  // CARGAR ÁLBUMES

  async function loadAlbums() {

    try {

      const response = await fetch(SHEET_CSV_URL, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("No se pudo leer la planilla.");
      }

      const csvText = await response.text();

      renderAlbums(parseCSV(csvText));

    } catch (error) {

      console.error(error);

      gallery.innerHTML =
        '<p class="gallery-message">No pudimos cargar los álbumes. Verificá que la planilla esté publicada en la web.</p>';

    }
  }

  loadAlbums();

</script>

</body>
</html>
