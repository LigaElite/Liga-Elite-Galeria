<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liga Élite | Galería Oficial</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080B13;
  color: #FFFFFF;
  font-family: 'Poppins', sans-serif;
}

/* ENCABEZADO */

header {
  background: linear-gradient(110deg, #10275D, #080B13);
  padding: 25px 6%;
  border-bottom: 1px solid #263C68;
  display: flex;
  align-items: center;
  gap: 22px;
}

header img {
  width: 90px;
  height: 90px;
  object-fit: contain;
  border-radius: 0;
  filter: drop-shadow(0 5px 12px rgba(70,140,255,.35));
}

.brand h1 {
  font-family: 'Anton', sans-serif;
  font-size: 36px;
  letter-spacing: 5px;
  margin: 0;
  background: linear-gradient(
    180deg,
    #FFFFFF 0%,
    #DCE5F2 30%,
    #899BB3 65%,
    #F4F7FC 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.brand p {
  margin: 5px 0 0;
  color: #B9C8E1;
  font-size: 11px;
  letter-spacing: 3px;
}

/* CONTENIDO */

main {
  max-width: 1150px;
  margin: auto;
  padding: 42px 24px;
}

.intro {
  margin-bottom: 30px;
}

.intro h2 {
  font-family: 'Anton', sans-serif;
  font-size: 38px;
  letter-spacing: 2px;
  margin: 0;
  color: #E1E8F3;
}

.intro p {
  color: #AEB6C8;
  font-size: 13px;
  margin-top: 8px;
}

/* GALERÍA */

.gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.card {
  position: relative;
  min-height: 280px;
  border-radius: 17px;
  overflow: hidden;
  background: linear-gradient(135deg, #173C80, #080D1B);
  border: 1px solid #34466B;
  display: flex;
  align-items: flex-end;
  text-decoration: none;
  color: white;
  transition: transform .25s ease, border-color .25s ease;
}

.card:hover {
  transform: translateY(-4px);
  border-color: #9CB9E9;
}

.card img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: .75;
}

.card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    transparent 20%,
    rgba(0,0,0,.88) 100%
  );
}

.info {
  position: relative;
  z-index: 2;
  padding: 22px;
  width: 100%;
}

.info h3 {
  font-family: 'Anton', sans-serif;
  font-size: 29px;
  letter-spacing: 1.5px;
  margin: 0;
  color: #FFFFFF;
}

.info p {
  font-size: 12px;
  color: #D5DBE8;
  margin: 6px 0 0;
}

.count {
  position: absolute;
  top: 15px;
  right: 15px;
  background: rgba(10,20,45,.92);
  border: 1px solid #91B4ED;
  border-radius: 20px;
  padding: 7px 14px;
  font-size: 11px;
  font-weight: 600;
  z-index: 3;
  color: #E6EDF9;
}

/* PIE */

footer {
  text-align: center;
  color: #8493B1;
  padding: 35px 15px;
  font-size: 10px;
  letter-spacing: 2px;
  border-top: 1px solid #202C44;
}

/* CELULARES */

@media(max-width: 600px) {

  header {
    padding: 19px 16px;
    gap: 14px;
  }

  header img {
    width: 68px;
    height: 68px;
  }

  .brand h1 {
    font-size: 27px;
    letter-spacing: 3px;
  }

  .brand p {
    font-size: 8px;
    letter-spacing: 2px;
  }

  main {
    padding: 30px 14px;
  }

  .intro h2 {
    font-size: 30px;
  }

  .gallery {
    gap: 12px;
  }

  .card {
    min-height: 205px;
    border-radius: 13px;
  }

  .info {
    padding: 12px;
  }

  .info h3 {
    font-size: 20px;
    letter-spacing: 1px;
  }

  .info p {
    font-size: 9px;
  }

  .count {
    font-size: 9px;
    padding: 5px 8px;
    top: 9px;
    right: 9px;
  }
}

</style>
</head>

<body>

<header>

  <img src="logo-liga.png" alt="Logo Liga Élite">

  <div class="brand">
    <h1>LIGA ÉLITE</h1>
    <p>GALERÍA OFICIAL DE FOTOS</p>
  </div>

</header>

<main>

  <section class="intro">
    <h2>GALERÍA DE FOTOS</h2>
    <p>Encontrá y disfrutá las fotografías de cada jornada.</p>
  </section>

  <section class="gallery">

    <a class="card" href="#" target="_blank">
      <span class="count">40 FOTOS</span>

      <div class="info">
        <h3>FECHA 21.11</h3>
        <p>21 de noviembre de 2026</p>
      </div>
    </a>

    <a class="card" href="#" target="_blank">
      <span class="count">46 FOTOS</span>

      <div class="info">
        <h3>FECHA 14.11</h3>
        <p>14 de noviembre de 2026</p>
      </div>
    </a>

  </section>

</main>

<footer>
  LIGA ÉLITE · FÚTBOL Y PASIÓN
</footer>

</body>
</html>
