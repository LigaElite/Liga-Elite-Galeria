
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liga Élite | Galería Oficial</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080d18;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }

    /* ENCABEZADO */

    header {
      background: linear-gradient(120deg, #07152e, #102c58, #07152e);
      border-bottom: 1px solid rgba(150, 190, 255, 0.3);
      padding: 25px 7%;
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      background: transparent;
      flex-shrink: 0;
    }

    .brand h1 {
      font-family: 'Anton', sans-serif;
      font-size: clamp(35px, 5vw, 52px);
      letter-spacing: 4px;
      color: #dcecff;
      line-height: 1.1;
    }

    .brand p {
      font-size: 12px;
      letter-spacing: 5px;
      margin-top: 10px;
      color: #c6d9f5;
    }

    /* CONTENIDO PRINCIPAL */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 65px 7%;
    }

    .section-title {
      font-family: 'Anton', sans-serif;
      font-size: clamp(34px, 5vw, 48px);
      letter-spacing: 1px;
      margin-bottom: 12px;
      color: #e7f1ff;
    }

    .section-description {
      font-size: 15px;
      color: #c4cbd7;
      margin-bottom: 40px;
    }

    /* TARJETAS DE FECHAS */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 25px;
    }

    .date-card {
      position: relative;
      min-height: 370px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 30px;
      overflow: hidden;
      border-radius: 25px;
      text-decoration: none;
      color: white;
      background:
        linear-gradient(
          180deg,
          rgba(10, 50, 105, 0.45),
          rgba(4, 15, 35, 0.96)
        ),
        linear-gradient(135deg, #1765bb, #102b55 65%, #07152c);
      border: 1px solid rgba(160, 200, 255, 0.45);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .date-card:hover {
      transform: translateY(-6px);
      border-color: #dcecff;
    }

    .photo-count {
      position: absolute;
      top: 25px;
      right: 25px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 30px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 700;
      background: rgba(5, 20, 45, 0.25);
    }

    .date-card h3 {
      font-family: 'Anton', sans-serif;
      font-size: 36px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .date-card p {
      font-size: 14px;
      color: #d7e3f5;
    }

    /* PIE DE PÁGINA */

    footer {
      text-align: center;
      padding: 30px 15px;
      border-top: 1px solid rgba(150, 190, 255, 0.2);
      color: #8294ad;
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* ADAPTACIÓN A CELULARES */

    @media (max-width: 700px) {
      header {
        padding: 20px 5%;
      }

      .header-content {
        gap: 15px;
      }

      .logo {
        width: 70px;
        height: 70px;
      }

      .brand h1 {
        font-size: 32px;
        letter-spacing: 2px;
      }

      .brand p {
        font-size: 9px;
        letter-spacing: 2px;
      }

      main {
        padding: 45px 5%;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .date-card {
        min-height: 300px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-content">

      <!-- LOGO TRANSPARENTE -->
      <img
        class="logo"
        src="Liga-Elite-Transparente.png"
        alt="Logo Liga Élite"
      >

      <div class="brand">
        <h1>LIGA ÉLITE</h1>
        <p>GALERÍA OFICIAL DE FOTOS</p>
      </div>

    </div>
  </header>

  <main>

    <h2 class="section-title">GALERÍA DE FOTOS</h2>

    <p class="section-description">
      Encontrá y disfrutá las fotografías de cada jornada.
    </p>

    <section class="gallery-grid">

      <!-- FECHA 21.11 -->
      <a href="#" class="date-card">
        <span class="photo-count">40 FOTOS</span>
        <h3>FECHA 21.11</h3>
        <p>21 de noviembre de 2026</p>
      </a>

      <!-- FECHA 14.11 -->
      <a href="#" class="date-card">
        <span class="photo-count">40 FOTOS</span>
        <h3>FECHA 14.11</h3>
        <p>14 de noviembre de 2026</p>
      </a>

    </section>

  </main>

  <footer>
    LIGA ÉLITE · GALERÍA OFICIAL
  </footer>

</body>
</html>
